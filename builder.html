<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Builder</title>
<style>
  /* ---------- themes ----------
     default (no data-theme / "mono") = white bg, black text/borders.
     data-theme="blue"  = soft blue bg, white cards, hard black shadow.
     data-theme="dark"  = near-black bg, dark gray cards, hard black shadow.
     All three share the same flat, no-radius "card + offset shadow" look. */
  :root{
    --bg:#ffffff; --surface:#ffffff; --fg:#111111; --muted:#666666;
    --line:rgba(0,0,0,.14); --line-strong:#000000;
    --accent:#111111; --card-shadow:6px 6px 0 #000000;
  }
  body[data-theme="blue"]{
    --bg:#AEC3F7; --surface:#ffffff; --fg:#111111; --muted:#3d3d3d;
    --line:rgba(17,17,17,.2); --line-strong:#111111;
    --accent:#111111; --card-shadow:6px 6px 0 #111111;
  }
  body[data-theme="dark"]{
    --bg:#151515; --surface:#242424; --fg:#f1efe9; --muted:#9c988f;
    --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.4);
    --accent:#D9503A; --card-shadow:6px 6px 0 #000000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
    color:var(--fg); background:var(--bg); font-size:14px; -webkit-font-smoothing:antialiased;
    transition:background .25s, color .25s;
  }
  button{font:inherit; cursor:pointer; background:none; border:none; color:inherit;}
  input,textarea,select{font:inherit; color:inherit;}
  a{color:inherit;}

  #topbar{
    height:52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; border-bottom:1px solid var(--line);
  }
  #topbar .brand{font-weight:800; letter-spacing:-.01em;}
  #topbar .brand span{color:var(--accent);}
  #topbar a{font-size:12px; color:var(--muted); border-bottom:1px solid var(--line-strong); padding-bottom:2px;}
  #topbar a:hover{color:var(--fg); border-color:var(--fg);}

  #app{display:grid; grid-template-columns:260px 1fr 1fr; height:calc(100vh - 52px);}

  /* ---------- sidebar ---------- */
  #sidebar{border-right:1px solid var(--line); overflow-y:auto; padding:18px;}
  #category-tabs{width:100%; margin-bottom:14px;}
  #category-tabs button{flex:1;}
  #new-project-btn{
    width:100%; padding:10px; border:1px solid var(--line-strong);
    font-weight:600; margin-bottom:22px; text-align:center;
    background:var(--surface); box-shadow:var(--card-shadow);
  }
  #new-project-btn:hover{border-color:var(--accent); color:var(--accent);}
  .project-item{
    display:flex; align-items:center; gap:10px; padding:10px 8px;
    border:1px solid var(--line-strong); background:var(--surface); box-shadow:var(--card-shadow);
    cursor:pointer; margin-bottom:16px;
  }
  .project-item:hover{background:color-mix(in srgb, var(--fg) 6%, var(--bg));}
  .project-item.active{background:var(--fg); color:var(--bg);}
  .project-item.dragging{opacity:.35;}
  .project-item .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:1px solid var(--line-strong);}
  .project-item .info{flex:1; min-width:0;}
  .project-item .p-title{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .project-item .p-sub{font-size:11px; color:var(--muted);}
  .project-item.active .p-sub{opacity:.65;}
  .project-item .move{opacity:0; font-size:10px; color:var(--muted); flex:0 0 auto; border:1px solid var(--line-strong); border-radius:10px; padding:2px 7px; white-space:nowrap;}
  .project-item:hover .move{opacity:1;}
  .project-item.active .move{opacity:.85; border-color:currentColor;}
  .project-item .move:hover{color:var(--accent); border-color:var(--accent);}
  .project-item .del{opacity:0; font-size:12px; color:var(--muted); flex:0 0 auto;}
  .project-item:hover .del{opacity:1;}
  .project-item.active .del{opacity:.7;}
  .project-item .del:hover{color:var(--accent);}
  #sidebar-empty{font-size:12px; color:var(--muted); padding:8px; line-height:1.6;}

  /* ---------- editor ---------- */
  #editor{overflow-y:auto; padding:22px 32px 120px; border-right:1px solid var(--line); line-height:1.3;}
  #editor .empty-state{color:var(--muted); font-size:13px; padding-top:60px; text-align:center; line-height:1.8;}
  .field-group{margin-bottom:13px;}
  .field-row{display:flex; gap:12px;}
  .field-row > *{flex:1; min-width:0;}
  .tag-tabs{display:flex; flex-wrap:wrap; gap:6px;}
  .tag-tabs button{font-size:11.5px; padding:6px 12px; border:1px solid var(--line-strong); border-radius:14px; background:var(--surface);}
  .tag-tabs button:hover{border-color:var(--accent);}
  .tag-tabs button.active{background:var(--fg); color:var(--bg); border-color:var(--fg);}
  .tag-tabs button.add-tag{border-style:dashed; color:var(--muted);}
  .tag-tabs button.add-tag:hover{color:var(--accent); border-color:var(--accent);}
  label.field-label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px;}
  .field, .field-inline{
    width:100%; border:1px solid var(--line-strong); padding:7px 10px;
    font-size:13.5px; background:var(--surface); color:var(--fg);
  }
  .field:focus, .field-inline:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  textarea.field{resize:vertical; min-height:56px; line-height:1.4; font-family:inherit;}
  .color-row{display:flex; gap:8px; align-items:center;}
  .color-row input[type=color]{width:40px; height:32px; border:1px solid var(--line-strong); padding:2px; background:var(--surface);}
  .radio-row{display:flex; gap:16px; align-items:center; font-size:13px; padding:2px 0;}
  .radio-row label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .slider-value{font-weight:600; color:var(--fg); text-transform:none; letter-spacing:0; font-size:11px;}
  input[type=range].field{
    -webkit-appearance:none; appearance:none; width:100%; height:24px; padding:0;
    background:transparent; border:none;
  }
  input[type=range].field::-webkit-slider-runnable-track{height:4px; background:var(--line-strong); border-radius:2px;}
  input[type=range].field::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--accent); margin-top:-6px; cursor:pointer; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong);
  }

  .section{margin-top:18px; padding-top:14px; border-top:1px solid var(--line);}
  .section-head{display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; margin-bottom:10px;}
  .section-head[data-toggle]{cursor:pointer; user-select:none;}
  .section-head .chevron{display:inline-block; transition:transform .15s; margin-right:4px; color:var(--muted); font-size:11px;}
  .section.collapsed .chevron{transform:rotate(-90deg);}
  .section.collapsed .section-body{display:none;}
  .btn-sm{font-size:12px; border:1px solid var(--line-strong); padding:5px 10px;}
  .btn-sm:hover{border-color:var(--accent); color:var(--accent);}
  .btn-primary{background:var(--accent); color:var(--bg); border:1px solid var(--line-strong); padding:8px 12px; font-weight:600; font-size:13px;}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-secondary{background:var(--surface); color:var(--fg); border:1.5px solid var(--fg); padding:8px 12px; font-weight:600; font-size:13px;}
  .btn-secondary:hover{background:color-mix(in srgb, var(--fg) 8%, transparent);}
  .btn-row{display:flex; gap:8px; margin-bottom:16px;}
  .btn-row button{flex:1; padding:9px 8px; font-size:12.5px; white-space:nowrap;}

  .block-card{border:1px solid var(--line-strong); padding:13px; margin-bottom:22px; background:var(--surface); box-shadow:var(--card-shadow);}
  .block-card.dragging{opacity:.35;}
  .block-card-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .drag-handle{cursor:grab; color:var(--muted); font-size:15px; user-select:none; flex:0 0 auto;}
  .block-card-head input{flex:1; font-weight:700;}
  .icon-btn{font-size:12px; color:var(--muted); padding:4px 6px; flex:0 0 auto;}
  .icon-btn:hover{color:var(--accent);}

  .image-list{display:flex; flex-direction:column; gap:12px; margin:14px 0;}
  .image-row{display:flex; align-items:center; gap:10px; border:1px solid var(--line-strong); padding:6px 8px; background:var(--surface); box-shadow:var(--card-shadow); cursor:grab;}
  .image-row.dragging{opacity:.35;}
  .image-row .thumb{width:44px; height:44px; object-fit:cover; background:var(--fg); flex:0 0 auto;}
  .image-row .fname{flex:1; min-width:0; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fname{font-size:12px; color:var(--fg);}
  #font-preview-box{transition:border-color .15s, background .15s; background:var(--surface); color:var(--fg); box-shadow:var(--card-shadow);}
  #font-preview-box.drag-over{border-color:var(--accent) !important; background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
  .image-row .hero-badge{font-size:10px; padding:2px 7px; border-radius:10px; background:var(--accent); color:var(--bg); flex:0 0 auto;}
  .image-row .hero-toggle{font-size:11px; color:var(--muted); border:1px solid var(--line-strong); border-radius:10px; padding:2px 8px; flex:0 0 auto;}
  .image-row .hero-toggle:hover{border-color:var(--accent); color:var(--accent);}
  .image-list-empty{font-size:12px; color:var(--muted); padding:10px 0;}

  .block-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .credit-row{display:flex; gap:8px; margin-bottom:8px;}
  .credit-row input{flex:1;}
  input[type=file]{display:none;}

  /* ---------- preview ---------- */
  #preview-pane{display:flex; flex-direction:column; overflow:hidden;}
  .preview-toolbar{height:52px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--line);}
  .view-toggle{display:flex; gap:4px; background:color-mix(in srgb, var(--fg) 8%, var(--bg)); border-radius:8px; padding:3px;}
  .view-toggle button{padding:6px 14px; border-radius:6px; font-size:12px; font-weight:600;}
  .view-toggle button.active{background:var(--fg); color:var(--bg);}
  .preview-stage{flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:28px; background:color-mix(in srgb, var(--fg) 8%, var(--bg));}
  .preview-frame-wrap{flex:0 0 auto; box-shadow:0 10px 40px rgba(0,0,0,.18); background:#fff;}
  .preview-stage.mobile .preview-frame-wrap{border-radius:26px; overflow:hidden;}
  .preview-stage iframe{border:0; background:#fff; display:block; width:100%; height:100%;}
  .preview-empty{color:var(--muted); font-size:13px; margin-top:60px;}

  /* ---------- export modal ---------- */
  #export-modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:900; align-items:center; justify-content:center;}
  #export-modal.open{display:flex;}
  .modal-box{background:var(--surface); color:var(--fg); width:min(760px,92vw); max-height:82vh; border:1px solid var(--line-strong); padding:24px; display:flex; flex-direction:column; box-shadow:var(--card-shadow); overflow-y:auto;}
  .modal-box h3{margin-bottom:6px;}
  .modal-box p.hint{font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.6;}
  .modal-box textarea{flex:1; min-height:340px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; border:1px solid var(--line); padding:12px; white-space:pre; overflow:auto; background:color-mix(in srgb, var(--fg) 4%, var(--surface)); color:var(--fg);}

  /* ---------- generate direction modal ---------- */
  #direction-modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:900; align-items:center; justify-content:center;}
  #direction-modal.open{display:flex;}
  #direction-modal .modal-box{max-height:88vh;}
  #direction-modal .view-toggle{flex-wrap:wrap;}
  #direction-modal .view-toggle button{white-space:nowrap;}
  #direction-modal textarea.field{min-height:64px;}
  #short-lines-row input{max-width:100px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

  @media (max-width:1200px){
    #app{grid-template-columns:220px 1fr 1fr;}
  }

  #theme-toggle{
    position:fixed; left:20px; bottom:20px; z-index:950;
    width:34px; height:34px; border-radius:50%;
    border:2px solid var(--line-strong);
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transition:transform .15s, background .2s;
  }
  #theme-toggle:hover{transform:scale(1.1);}
  #theme-toggle:active{transform:scale(.94);}
</style>
</head>
<body>

  <div id="topbar">
    <div class="brand">Portfolio <span>Builder</span></div>
    <a href="index.html" target="_blank" rel="noopener">사이트 보기 ↗</a>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="view-toggle" id="category-tabs">
        <button type="button" data-category="work" class="active">Work</button>
        <button type="button" data-category="play">Play</button>
      </div>
      <button id="new-project-btn">+ 새 프로젝트</button>
      <div id="project-list" data-sort-scope="projects"></div>
    </aside>

    <main id="editor">
      <div class="empty-state">왼쪽에서 프로젝트를 선택하거나<br>새 프로젝트를 만들어주세요.</div>
    </main>

    <section id="preview-pane">
      <div class="preview-toolbar">
        <div class="view-toggle">
          <button data-view="pc" class="active">PC</button>
          <button data-view="mobile">Mobile</button>
        </div>
        <button class="btn-primary" id="export-btn">코드 내보내기</button>
      </div>
      <div class="preview-stage pc" id="preview-stage">
        <div class="preview-frame-wrap">
          <iframe id="preview-frame" title="preview"></iframe>
        </div>
      </div>
    </section>
  </div>

  <button id="theme-toggle" title="테마 전환"></button>

  <div id="export-modal">
    <div class="modal-box">
      <h3>프로젝트 코드 내보내기</h3>
      <p class="hint">이 코드를 index.html의 PROJECTS 배열에 붙여넣으세요. 이미지 경로는 선택하신 폴더 구조를 기준으로 자동 생성됩니다 — 실제 사이트에서 보이려면 같은 폴더 구조로 이미지 파일을 프로젝트 폴더 옆에 두셔야 합니다.</p>
      <textarea id="export-text" readonly></textarea>
      <div class="modal-actions">
        <button class="btn-sm" id="export-close">닫기</button>
        <button class="btn-primary" id="export-copy">클립보드에 복사</button>
      </div>
    </div>
  </div>

  <div id="direction-modal">
    <div class="modal-box">
      <h3>생성 방향 설정</h3>
      <p class="hint">아래 설정에 맞춰 GENERATE가 글을 씁니다. 여기서 고른 설정은 다음 생성 때도 그대로 유지됩니다.</p>

      <div class="field-group">
        <label class="field-label">어투</label>
        <div class="view-toggle" data-group="tone">
          <button type="button" data-value="observer">관찰자 (1인칭 건조체)</button>
          <button type="button" data-value="third-person">3인칭</button>
          <button type="button" data-value="interview">인터뷰체</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">구조</label>
        <div class="view-toggle" data-group="structure">
          <button type="button" data-value="three-act">3막 (맥락→접근→결과)</button>
          <button type="button" data-value="vignette">비네트 (장면별 단편)</button>
          <button type="button" data-value="single-flow">단일 흐름</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">길이</label>
        <div class="view-toggle" data-group="length">
          <button type="button" data-value="short">짧게</button>
          <button type="button" data-value="medium">중간</button>
          <button type="button" data-value="long">길게</button>
        </div>
        <div id="short-lines-row" class="field-row field-group" style="display:none; margin-top:8px;">
          <div><label class="field-label">짧게 = 몇 줄?</label>
            <input class="field" type="number" id="short-lines-input" min="1" max="20" value="3"></div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">사진 흐름</label>
        <div class="view-toggle" data-group="photoFlow">
          <button type="button" data-value="match-text">글에 맞춤</button>
          <button type="button" data-value="chronological">시간순</button>
          <button type="button" data-value="detail-to-wide">디테일 → 와이드</button>
          <button type="button" data-value="wide-to-detail">와이드 → 디테일</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">방향 메모 (이번 글에서 강조할 것)</label>
        <textarea class="field" id="direction-note" placeholder="예: 팀워크보다는 개인의 관찰력을 강조해줘"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-sm" id="direction-cancel">취소</button>
        <button class="btn-primary" id="direction-confirm">생성</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ======================================================================
     0. small helpers
  ====================================================================== */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function slugify(s){
    return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }
  function escapeHTML(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function naturalSort(a,b){ return a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"}); }
  function debounce(fn, ms){
    let t;
    return function(){ const args=arguments; clearTimeout(t); t=setTimeout(()=>fn.apply(null,args), ms); };
  }

  /* ======================================================================
     1. IndexedDB persistence
  ====================================================================== */
  const DB_NAME = "pf-builder-db";
  const STORE = "projects";
  function dbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE, {keyPath:"id"}); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbPut(project){
    const db = await dbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(project);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbGetAll(){
    const db = await dbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbDelete(id){
    const db = await dbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ======================================================================
     2. data model
  ====================================================================== */
  function newProject(title, category){
    const t = title || "New Project";
    return {
      id: (slugify(t) || "project") + "-" + uid().slice(0,5),
      title: t,
      category: category === "play" ? "play" : "work",
      color: "#C4402A",
      textColor: "#fff3ef",
      titleLetterSpacing: -0.02,
      titleLineHeight: 1.02,
      titleFont: { name:"", dataUrl:"" },
      boxWidthScale: 1,
      boxHeightScale: 1,
      tag: "Campaign",
      year: "",
      meta: "",
      heroType: "image",
      heroVideoId: "",
      heroImageId: null,
      social: { youtube:"", vimeo:"", instagram:"" },
      blocks: [ { id: uid(), label:"Work", heading:"", paragraphs:["Role — Art Direction"], images:[] } ],
      credits: []
    };
  }
  function newBlock(){
    return { id: uid(), label:"New Block", heading:"", paragraphs:[], images:[] };
  }
  function allImages(project){
    const out = [];
    (project.blocks||[]).forEach(b => (b.images||[]).forEach(im => out.push(im)));
    return out;
  }
  function hydrateProject(project){
    allImages(project).forEach(im => {
      if(im.file){
        try{ im.url = URL.createObjectURL(im.file); }catch(e){ im.url = ""; }
      }
      /* path-only sample images (no File — just a relative path next to builder.html)
         already have a usable url and don't need a blob URL. */
    });
    return project;
  }

  /* ---- SSF SHOP sample project — same content as the real detail page, images referenced
     by relative path (no upload needed) since they already live in "SSF SHOP/Capture/" next
     to this file. ---- */
  function ssfPathSet(prefix, count){
    return Array.from({length:count}, (_, i) => {
      const name = prefix + "-" + (i+1) + ".jpg";
      const relPath = "SSF SHOP/Capture/" + name;

  let projects = [];

  /* ---- undo / redo ----
     A snapshot is taken right before a change starts (structural action, or the moment a
     field gains focus) so Ctrl/Cmd+Z steps back one committed edit at a time. structuredClone
     preserves File objects correctly (unlike JSON), so image uploads survive undo/redo. */
  const UNDO_LIMIT = 60;
  let undoStack = [];
  let redoStack = [];

  function snapshot(){
    const p = getCurrentProject();
    if(!p) return;
    try{
      undoStack.push(structuredClone(p));
      if(undoStack.length > UNDO_LIMIT) undoStack.shift();
      redoStack = [];
    }catch(e){ console.error("snapshot failed", e); }
  }

  function applySnapshot(snap){
    const idx = projects.findIndex(p => p.id === snap.id);
    if(idx === -1) return;
    hydrateProject(snap);
    projects[idx] = snap;
    if(currentId !== snap.id) currentId = snap.id;
    renderSidebar();
    renderEditor();
    refreshPreview();
    scheduleSave();
  }

  function undo(){
    if(!undoStack.length) return;
    const cur = getCurrentProject();
    const snap = undoStack.pop();
    if(cur){
      try{ redoStack.push(structuredClone(cur)); }catch(e){}
    }
    applySnapshot(snap);
  }
  function redo(){
    if(!redoStack.length) return;
    const cur = getCurrentProject();
    const snap = redoStack.pop();
    if(cur){
      try{ undoStack.push(structuredClone(cur)); }catch(e){}
    }
    applySnapshot(snap);
  }

  document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if(!(e.ctrlKey || e.metaKey) || key !== "z") return;
    const active = document.activeElement;
    const isTextEditable = active && (active.tagName === "TEXTAREA" ||
      (active.tagName === "INPUT" && (active.type === "text" || active.type === "")));
    if(isTextEditable) return; // let the browser's native in-field undo run
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  });

  /* ======================================================================
     5. sortable (drag & drop) — delegated on #editor
  ====================================================================== */
  const editorEl = document.getElementById("editor");
  let dragItem = null;

  function getDragAfterElement(scope, y){
    const items = Array.from(scope.children).filter(el => el.matches("[data-sort-item]") && el !== dragItem);
    return items.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset) return {offset, element:child};
      return closest;
    }, {offset:-Infinity, element:null}).element;
  }

  editorEl.addEventListener("dragstart", (e) => {
    const item = e.target.closest("[data-sort-item]");
    if(!item) return;
    snapshot();
    dragItem = item;
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", ""); }catch(err){}
  });
  editorEl.addEventListener("dragover", (e) => {
    if(!dragItem) return;
    const scope = e.target.closest("[data-sort-scope]");
    if(!scope) return;
    e.preventDefault();
    const afterEl = getDragAfterElement(scope, e.clientY);
    if(afterEl == null) scope.appendChild(dragItem);
    else scope.insertBefore(dragItem, afterEl);
  });
  editorEl.addEventListener("dragend", () => {
    if(!dragItem) return;
    dragItem.classList.remove("dragging");
    const scope = dragItem.closest("[data-sort-scope]");
    dragItem = null;
    if(scope) syncOrderFromDOM(scope);
  });

  function syncOrderFromDOM(scope){
    const kind = scope.dataset.sortScope;
    const ids = Array.from(scope.children).filter(el => el.matches("[data-sort-item]")).map(el => el.dataset.itemId);
    if(kind === "projects"){
      ids.forEach((id, i) => {
        const p = projects.find(x => x.id === id);
        if(p){ p.order = i; dbPut(p).catch(e => console.error("reorder save failed", e)); }
      });
      return;
    }
    const project = getCurrentProject();
    if(!project) return;
    if(kind === "blocks"){
      project.blocks = ids.map(id => project.blocks.find(b => b.id === id)).filter(Boolean);
    } else if(kind.indexOf("images:") === 0){
      const blockId = kind.slice(7);
      const block = project.blocks.find(b => b.id === blockId);
      if(block) block.images = ids.map(id => block.images.find(im => im.id === id)).filter(Boolean);
    }
    saveAndRefresh();
  }

  /* ---- field input/change handling (delegated, no full re-render on typing) ---- */
  function handleField(el){
    const project = getCurrentProject();
    if(!project) return;
    const field = el.dataset.field;
    const blockId = el.dataset.blockId;
    const block = blockId ? project.blocks.find(b => b.id === blockId) : null;

    switch(field){
      case "title": project.title = el.value; syncSidebarItemText(project); break;
      case "color":
        project.color = el.value;
        document.querySelector('[data-field="color-hex"]').value = el.value;
        syncSidebarItemText(project);
        break;
      case "color-hex":
        if(/^#[0-9a-fA-F]{6}$/.test(el.value)){
          project.color = el.value;
          document.querySelector('input[type=color][data-field="color"]').value = el.value;
          syncSidebarItemText(project);
        }
        break;
      case "textColor":
        project.textColor = el.value;
        document.querySelector('[data-field="textColor-hex"]').value = el.value;
        break;
      case "textColor-hex":
        if(/^#[0-9a-fA-F]{6}$/.test(el.value)){
          project.textColor = el.value;
          document.querySelector('input[type=color][data-field="textColor"]').value = el.value;
        }
        break;
      case "titleLetterSpacing": {
        project.titleLetterSpacing = parseFloat(el.value);
        const disp = document.querySelector('[data-value-for="titleLetterSpacing"]');
        if(disp) disp.textContent = project.titleLetterSpacing + "em";
        break;
      }
      case "titleLineHeight": {
        project.titleLineHeight = parseFloat(el.value);
        const disp2 = document.querySelector('[data-value-for="titleLineHeight"]');
        if(disp2) disp2.textContent = project.titleLineHeight;
        break;
      }
      case "boxWidthScale": {
        project.boxWidthScale = parseFloat(el.value);
        const disp3 = document.querySelector('[data-value-for="boxWidthScale"]');
        if(disp3) disp3.textContent = Math.round(project.boxWidthScale*100) + "%";
        break;
      }
      case "boxHeightScale": {
        project.boxHeightScale = parseFloat(el.value);
        const disp4 = document.querySelector('[data-value-for="boxHeightScale"]');
        if(disp4) disp4.textContent = Math.round(project.boxHeightScale*100) + "%";
        break;
      }
      case "tag": project.tag = el.value; syncSidebarItemText(project); break;
      case "year": project.year = el.value; syncSidebarItemText(project); break;
      case "meta": project.meta = el.value; break;
      case "heroType": project.heroType = el.value; break;
      case "heroImageId": project.heroImageId = el.value || null; break;
      case "heroVideoId": project.heroVideoId = el.value; break;
      case "social-youtube": project.social.youtube = el.value; break;
      case "social-vimeo": project.social.vimeo = el.value; break;
      case "social-instagram": project.social.instagram = el.value; break;
      case "label": if(block) block.label = el.value; break;
      case "heading": if(block) block.heading = el.value; break;
      case "paragraphs": if(block) block.paragraphs = el.value.split("\n"); break;
      case "credit-label": {
        const i = parseInt(el.dataset.creditIndex, 10);
        if(project.credits[i]) project.credits[i][0] = el.value;
        break;
      }
      case "credit-value": {
        const i = parseInt(el.dataset.creditIndex, 10);
        if(project.credits[i]) project.credits[i][1] = el.value;
        break;
      }
    }
    saveAndRefresh();
  }
  function syncSidebarItemText(project){
    const item = sidebarList.querySelector('[data-project-id="' + project.id + '"]');
    if(!item) return;
    item.querySelector(".dot").style.background = project.color;
    item.querySelector(".p-title").textContent = project.title || "Untitled";
    item.querySelector(".p-sub").textContent = [project.tag, project.year].filter(Boolean).join(" · ") || "—";
  }

  /* ---- structural actions (add/remove block, image, credit; file pickers) ---- */
  let pendingBlockId = null;
  const folderInput = document.createElement("input");
  folderInput.type = "file"; folderInput.webkitdirectory = true; folderInput.multiple = true;
  const filesInput = document.createElement("input");
  filesInput.type = "file"; filesInput.multiple = true; filesInput.accept = "image/*";
  document.body.appendChild(folderInput);
  document.body.appendChild(filesInput);

  function addFilesToBlock(fileList){
    const project = getCurrentProject();
    const block = project && project.blocks.find(b => b.id === pendingBlockId);
    if(!block) return;
    snapshot();
    const files = Array.from(fileList).filter(f => f.type.indexOf("image/") === 0);
    files.sort((a,b) => naturalSort(a.webkitRelativePath || a.name, b.webkitRelativePath || b.name));
    files.forEach(file => {
      const im = { id:uid(), file:file, relPath: file.webkitRelativePath || file.name, name:file.name };
      im.url = URL.createObjectURL(file);
      block.images.push(im);
      if(!project.heroImageId) project.heroImageId = im.id;
    });
    renderEditor();
    saveAndRefresh();
  }
  folderInput.addEventListener("change", () => { addFilesToBlock(folderInput.files); folderInput.value=""; });
  filesInput.addEventListener("change", () => { addFilesToBlock(filesInput.files); filesInput.value=""; });

  /* ---- title font: attach via button OR drag-and-drop onto the preview box ---- */
  const fontInput = document.createElement("input");
  fontInput.type = "file"; fontInput.accept = ".woff,.woff2,.ttf,.otf,font/*";
  document.body.appendChild(fontInput);

  function readFileAsDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  const FONT_EXT_RE = /\.(woff2?|ttf|otf)$/i;

  async function applyTitleFont(file){
    const project = getCurrentProject();
    if(!project || !file) return;
    snapshot();
    const dataUrl = await readFileAsDataURL(file);
    project.titleFont = { name: file.name, dataUrl: dataUrl };
    renderEditor();
    saveAndRefresh();
  }
  fontInput.addEventListener("change", () => {
    if(fontInput.files[0]) applyTitleFont(fontInput.files[0]);
    fontInput.value = "";
  });

  function applyTitleFontPreview(project){
    const box = document.getElementById("font-preview-box");
    let styleTag = document.getElementById("title-font-face");
    if(project && project.titleFont && project.titleFont.dataUrl){
      if(!styleTag){
        styleTag = document.createElement("style");
        styleTag.id = "title-font-face";
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = "@font-face{font-family:'BuilderTitleFont'; src:url(" + project.titleFont.dataUrl + ");}";
      if(box) box.style.fontFamily = "'BuilderTitleFont'";
    }else{
      if(styleTag) styleTag.textContent = "";
      if(box) box.style.fontFamily = "";
    }
  }

  editorEl.addEventListener("dragover", (e) => {
    const box = e.target.closest("#font-preview-box");
    if(box){ e.preventDefault(); box.classList.add("drag-over"); }
  });
  editorEl.addEventListener("dragleave", (e) => {
    const box = e.target.closest("#font-preview-box");
    if(box) box.classList.remove("drag-over");
  });
  editorEl.addEventListener("drop", (e) => {
    const box = e.target.closest("#font-preview-box");
    if(!box) return;
    e.preventDefault();
    box.classList.remove("drag-over");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file && FONT_EXT_RE.test(file.name)) applyTitleFont(file);
    else if(file) alert("폰트 파일(.woff, .woff2, .ttf, .otf)만 지원합니다.");
  });

  /* ---- Generate: local helper server (server.py) shells out to the `claude` CLI —
     no API key in the browser, no manual copy/paste. Run `python3 server.py` once
     from this folder, then click Generate. ---- */
  const GENERATE_SERVER = "http://localhost:8420";

  /* ---- Generate direction panel: shown before every Generate call so tone/
     structure/length/photo-flow/emphasis can be set. Persisted in localStorage
     so the last-used settings carry over to the next generation. ---- */
  const DIRECTION_DEFAULTS = {
    tone: "observer", structure: "three-act", length: "medium",
    shortLines: 3, photoFlow: "match-text", note: ""
  };
  let directionSettings = loadDirectionSettings();

  function loadDirectionSettings(){
    try{
      const saved = JSON.parse(localStorage.getItem("pf-builder-direction") || "{}");
      return Object.assign({}, DIRECTION_DEFAULTS, saved);
    }catch(e){ return Object.assign({}, DIRECTION_DEFAULTS); }
  }
  function saveDirectionSettings(){
    localStorage.setItem("pf-builder-direction", JSON.stringify(directionSettings));
  }

  const directionModal = document.getElementById("direction-modal");
  const shortLinesRow = document.getElementById("short-lines-row");
  const shortLinesInput = document.getElementById("short-lines-input");
  const directionNoteEl = document.getElementById("direction-note");

  function renderDirectionModal(){
    directionModal.querySelectorAll(".view-toggle").forEach(group => {
      const key = group.dataset.group;
      group.querySelectorAll("button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.value === directionSettings[key]);
      });
    });
    shortLinesRow.style.display = directionSettings.length === "short" ? "block" : "none";
    shortLinesInput.value = directionSettings.shortLines;
    directionNoteEl.value = directionSettings.note;
  }
  function openDirectionModal(){
    renderDirectionModal();
    directionModal.classList.add("open");
  }
  directionModal.addEventListener("click", (e) => {
    const btn = e.target.closest(".view-toggle button");
    if(btn){
      const key = btn.closest(".view-toggle").dataset.group;
      directionSettings[key] = btn.dataset.value;
      renderDirectionModal();
      return;
    }
    if(e.target.id === "direction-cancel"){ directionModal.classList.remove("open"); return; }
    if(e.target.id === "direction-confirm"){
      directionSettings.shortLines = Math.max(1, parseInt(shortLinesInput.value, 10) || DIRECTION_DEFAULTS.shortLines);
      directionSettings.note = directionNoteEl.value.trim();
      saveDirectionSettings();
      directionModal.classList.remove("open");
      runGenerate();
      return;
    }
  });

  async function runGenerate(){
    const project = getCurrentProject();
    if(!project) return;
    const btn = document.getElementById("generate-btn");
    const status = document.getElementById("generate-status");
    if(btn){ btn.disabled = true; btn.textContent = "생성 중... (문체 학습 때문에 최대 2~3분 걸릴 수 있어요)"; }
    if(status){ status.style.display = "block"; status.textContent = "로컬 서버(server.py)에 연결 중..."; }

    try{
      const res = await fetch(GENERATE_SERVER + "/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: project.title, tag: project.tag, meta: project.meta, direction: directionSettings })
      });
      if(!res.ok){
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || ("서버 응답 오류 (" + res.status + ")"));
      }
      const data = await res.json();

      snapshot();
      if(data.title) project.title = data.title;
      if(data.tag) project.tag = data.tag;
      if(data.meta) project.meta = data.meta;
      if(!project.blocks.length) project.blocks.push(newBlock());
      const block = project.blocks[0];
      if(data.heading) block.heading = data.heading;
      if(Array.isArray(data.paragraphs) && data.paragraphs.length) block.paragraphs = data.paragraphs;

      let addedImages = 0;
      if(Array.isArray(data.images) && data.images.length){
        data.images.forEach(relPath => {
          if(block.images.some(im => im.relPath === relPath)) return;
          const name = relPath.split("/").pop();
          block.images.push({ id: uid(), relPath: relPath, name: name, url: relPath });
          addedImages++;
        });
        if(!project.heroImageId && block.images[0]) project.heroImageId = block.images[0].id;
      }

      if(status){
        status.textContent = addedImages
          ? ("완료 — \"" + data.imageFolder + "\" 폴더에서 사진 " + addedImages + "장을 불러왔습니다.")
          : "완료 — 글은 채웠지만, 이름이 일치하는 사진 폴더를 찾지 못했어요. 사진은 직접 추가해주세요.";
      }
      renderEditor();
      saveAndRefresh();
    }catch(e){
      alert(
        "Generate 실패: " + e.message + "\n\n" +
        "로컬 서버가 켜져 있는지 확인해주세요.\n" +
        "터미널에서 이 폴더로 이동한 뒤 아래 명령을 실행하고 다시 시도하세요:\n\n" +
        "  python3 server.py\n"
      );
      if(btn){ btn.disabled = false; btn.textContent = "GENERATE"; }
      if(status){ status.style.display = "none"; }
    }
  }

  async function runSave(){
    const project = getCurrentProject();
    if(!project) return;
    const btn = document.getElementById("save-btn");

      await dbPut(project);
      if(btn){

      alert("저장 실패: " + e.message);

  /* ---- Publish: sends this project's exported code to server.py, which writes it
     into index.html's live PROJECTS array and git push's it — Vercel then auto-deploys
     from the GitHub repo. Requires server.py running AND GitHub remote configured. ---- */
  async function runPublish(){
    const project = getCurrentProject();
    if(!project) return;
    if(!confirm('"' + (project.title || "Untitled") + '" 프로젝트를 실제 사이트에 반영(Publish)할까요?\n\nindex.html이 수정되고 GitHub에 푸시되어 Vercel이 재배포합니다.')) return;

    const btn = document.getElementById("publish-btn");
    const status = document.getElementById("generate-status");
    if(btn){ btn.disabled = true; btn.textContent = "PUBLISHING..."; }
    if(status){ status.style.display = "block"; status.textContent = "index.html에 반영하고 GitHub에 푸시하는 중... (최대 1분)"; }

    try{
      const code = exportProjectCode(project);
      const res = await fetch(GENERATE_SERVER + "/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: project.id, title: project.title, code: code })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || ("서버 응답 오류 (" + res.status + ")"));

      if(status){
        status.textContent = "완료 — " + (data.action === "added" ? "새 프로젝트로 추가됨. " : "기존 항목이 갱신됨. ") + (data.note || "");
      }
      if(btn) btn.textContent = "PUBLISHED ✓";
    }catch(e){
      alert(
        "Publish 실패: " + e.message + "\n\n" +
        "로컬 서버가 켜져 있는지, GitHub 연동이 되어 있는지 확인해주세요.\n" +
        "터미널에서 이 폴더로 이동한 뒤 아래 명령을 실행하고 다시 시도하세요:\n\n" +
        "  python3 server.py\n"
      );
      if(status) status.style.display = "none";
    }finally{
      setTimeout(() => { if(btn){ btn.disabled = false; btn.textContent = "PUBLISH"; } }, 1800);
    }
  }

  /* ---- KR<->EN translate: same local server / claude CLI approach as Generate ---- */
  async function runTranslate(direction){
    const project = getCurrentProject();
    if(!project) return;
    const btnId = direction === "ko-en" ? "translate-ko-en-btn" : "translate-en-ko-btn";
    const btn = document.getElementById(btnId);
    const status = document.getElementById("generate-status");
    const origLabel = btn ? btn.textContent : "";
    if(btn){ btn.disabled = true; btn.textContent = "번역 중..."; }
    if(status){ status.style.display = "block"; status.textContent = "로컬 서버에서 번역 중..."; }

    try{
      const payload = {
        direction: direction,
        title: project.title || "",
        tag: project.tag || "",
        meta: project.meta || "",
        blocks: project.blocks.map(b => ({ heading: b.heading || "", paragraphs: b.paragraphs || [] }))
      };
      const res = await fetch(GENERATE_SERVER + "/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || ("서버 응답 오류 (" + res.status + ")"));
      }
      const data = await res.json();

      snapshot();
      if(data.title) project.title = data.title;
      if(data.tag) project.tag = data.tag;
      if(data.meta) project.meta = data.meta;
      if(Array.isArray(data.blocks)){
        data.blocks.forEach((b, i) => {
          if(!project.blocks[i]) return;
          if(b.heading != null) project.blocks[i].heading = b.heading;
          if(Array.isArray(b.paragraphs)) project.blocks[i].paragraphs = b.paragraphs;
        });
      }
      if(status) status.textContent = "완료 — " + (direction === "ko-en" ? "영문으로" : "한글로") + " 번역했습니다.";
      renderEditor();
      saveAndRefresh();
    }catch(e){
      alert(
        "번역 실패: " + e.message + "\n\n" +
        "로컬 서버가 켜져 있는지 확인해주세요 (python3 server.py)."
      );
      if(btn){ btn.disabled = false; btn.textContent = origLabel; }
      if(status){ status.style.display = "none"; }
    }
  }

  editorEl.addEventListener("click", (e) => {
    const project = getCurrentProject();
    if(!project) return;

    const categoryBtn = e.target.closest('#project-category-toggle button');
    if(categoryBtn){
      snapshot();
      project.category = categoryBtn.dataset.value === "play" ? "play" : "work";
      renderEditor();
      renderSidebar();
      saveAndRefresh();
      return;
    }

    const addTagBtn = e.target.closest('[data-action="add-tag"]');
    if(addTagBtn){
      const name = prompt("새 카테고리 이름을 입력하세요", "");
      if(name === null) return;
      const trimmed = name.trim();
      if(!trimmed) return;
      const custom = loadCustomTags();
      if(!custom.includes(trimmed)){ custom.push(trimmed); saveCustomTags(custom); }
      snapshot();
      project.tag = trimmed;
      renderEditor();
      renderSidebar();
      saveAndRefresh();
      return;
    }
    const tagBtn = e.target.closest('#tag-tabs button[data-tag]');
    if(tagBtn){
      snapshot();
      project.tag = tagBtn.dataset.tag;
      renderEditor();
      renderSidebar();
      saveAndRefresh();
      return;
    }

    const addFolderBtn = e.target.closest('[data-action="add-folder"]');
    if(addFolderBtn){ pendingBlockId = addFolderBtn.dataset.blockId; folderInput.click(); return; }

    const addFilesBtn = e.target.closest('[data-action="add-files"]');
    if(addFilesBtn){ pendingBlockId = addFilesBtn.dataset.blockId; filesInput.click(); return; }

    const removeImageBtn = e.target.closest('[data-action="remove-image"]');
    if(removeImageBtn){
      snapshot();
      const imageId = removeImageBtn.dataset.imageId;
      project.blocks.forEach(b => {
        const idx = b.images.findIndex(im => im.id === imageId);
        if(idx > -1){
          try{ URL.revokeObjectURL(b.images[idx].url); }catch(err){}
          b.images.splice(idx, 1);
        }
      });
      if(project.heroImageId === imageId) project.heroImageId = null;
      renderEditor(); saveAndRefresh();
      return;
    }

    const removeBlockBtn = e.target.closest('[data-action="remove-block"]');
    if(removeBlockBtn){
      const blockId = removeBlockBtn.dataset.blockId;
      if(confirm("이 블록을 삭제할까요? 안의 사진 목록도 함께 삭제됩니다.")){
        snapshot();
        const block = project.blocks.find(b => b.id === blockId);
        if(block) block.images.forEach(im => { try{ URL.revokeObjectURL(im.url); }catch(err){} });
        project.blocks = project.blocks.filter(b => b.id !== blockId);
        renderEditor(); saveAndRefresh();
      }
      return;
    }

    if(e.target.closest('[data-action="add-block"]')){
      snapshot();
      project.blocks.push(newBlock());
      renderEditor(); saveAndRefresh();
      return;
    }

    if(e.target.closest('[data-action="add-title-font"]')){ fontInput.click(); return; }
    if(e.target.closest('[data-action="remove-title-font"]')){
      snapshot();
      project.titleFont = { name:"", dataUrl:"" };
      renderEditor(); saveAndRefresh();
      return;
    }

    if(e.target.closest('[data-action="generate"]')){ openDirectionModal(); return; }
    if(e.target.closest('[data-action="save"]')){ runSave(); return; }
    if(e.target.closest('[data-action="translate-ko-en"]')){ runTranslate("ko-en"); return; }
    if(e.target.closest('[data-action="translate-en-ko"]')){ runTranslate("en-ko"); return; }
    if(e.target.closest('[data-action="publish"]')){ runPublish(); return; }

    const toggleHead = e.target.closest('[data-toggle]');
    if(toggleHead){
      const section = document.getElementById(toggleHead.dataset.toggle);
      if(section) section.classList.toggle("collapsed");
      return;
    }

    if(e.target.closest('[data-action="add-credit"]')){
      snapshot();
      project.credits.push(["", ""]);
      renderEditor(); saveAndRefresh();
      return;
    }
    const removeCreditBtn = e.target.closest('[data-action="remove-credit"]');
    if(removeCreditBtn){
      snapshot();
      const i = parseInt(removeCreditBtn.dataset.creditIndex, 10);
      project.credits.splice(i, 1);
      renderEditor(); saveAndRefresh();
      return;
    }
  });

  const PREVIEW_RUNTIME_JS = [
    'function activateGalleryFrame(gallery, index){',
    '  var frames = gallery.querySelectorAll(".gallery-frame");',
    '  var frame = frames[index];',
    '  var img = frame && frame.querySelector("img");',
    '  if(!img) return;',
    '  var apply = function(){',
    '    if(!gallery.dataset.baseHeight){ gallery.dataset.baseHeight = gallery.clientHeight; }',
    '    var baseHeight = parseFloat(gallery.dataset.baseHeight);',
    '    var ratio = img.naturalWidth / img.naturalHeight;',
    '    var availWidth = gallery.parentElement.clientWidth;',
    '    var height = baseHeight;',
    '    var width = height * ratio;',
    '    if(width > availWidth){ width = availWidth; height = width / ratio; }',
    '    gallery.style.height = height + "px";',
    '    gallery.style.width = width + "px";',
    '    gallery.querySelector(".gallery-track").style.transform = "translateX(-" + frame.offsetLeft + "px)";',
    '  };',
    '  if(img.complete && img.naturalWidth){ apply(); } else { img.addEventListener("load", apply, {once:true}); }',
    '}',
    'function rollGallery(gallery){',
    '  var count = parseInt(gallery.dataset.count, 10);',
    '  var index = parseInt(gallery.dataset.index, 10);',
    '  index = (index + 1) % count;',
    '  gallery.dataset.index = index;',
    '  gallery.querySelector(".gallery-counter").textContent = String(index+1).padStart(2,"0") + " / " + String(count).padStart(2,"0");',
    '  activateGalleryFrame(gallery, index);',
    '}',
    'document.querySelectorAll(".gallery").forEach(function(g){',
    '  g.addEventListener("click", function(){ rollGallery(g); });',
    '  activateGalleryFrame(g, 0);',
    '});',
    'window.addEventListener("resize", function(){',
    '  document.querySelectorAll(".gallery").forEach(function(g){',
    '    delete g.dataset.baseHeight;',
    '    g.style.height = "";',
    '    activateGalleryFrame(g, parseInt(g.dataset.index, 10));',
    '  });',
    '});'
  ].join("\n");

  function buildPreviewBodyHTML(project){
    const imgs = allImages(project);
    const hero = imgs.find(im => im.id === project.heroImageId) || imgs[0];
    const heroMedia = (project.heroType === "video" && project.heroVideoId)
      ? '<div class="p-hero-video"><iframe src="https://player.vimeo.com/video/' + encodeURIComponent(project.heroVideoId) + '?autoplay=1&loop=1&muted=1&background=1&app_id=122963" allow="autoplay; fullscreen; picture-in-picture"></iframe></div>'
      : (hero ? '<img src="' + hero.url + '" alt="">' : "");

    const blocksHTML = project.blocks.map((block, bi) => {
      const frames = (block.images||[]).map(im => '<div class="gallery-frame"><img src="' + im.url + '" alt=""></div>').join("");
      const count = (block.images||[]).length || 1;
      const heading = block.heading ? '<div class="p-body" style="font-weight:700;font-size:1.1rem;margin-top:22px;">' + escapeHTML(block.heading) + '</div>' : "";
      const paras = (block.paragraphs||[]).filter(t => t && t.trim()).map(t => '<p class="p-body">' + escapeHTML(t) + '</p>').join("");
      return '<div class="p-block">'
        + '<div class="gallery" data-index="0" data-count="' + count + '">'
        +   '<div class="gallery-track">' + frames + '</div>'
        +   '<div class="gallery-counter">01 / ' + String(count).padStart(2,"0") + '</div>'
        +   '<div class="gallery-hint">Click for next</div>'
        + '</div>'
        + '<div class="p-caption"><span class="label">' + escapeHTML(block.label||"") + '</span><span class="idx">' + String(bi+1).padStart(2,"0") + '</span></div>'
        + heading + paras
        + '</div>';
    }).join("");

    const creditsHTML = (project.credits && project.credits.length)
      ? '<div class="p-credits"><h3>Credits</h3><div class="credits-grid">' + project.credits.map(c =>
          '<div class="credit-item"><div class="label">' + escapeHTML(c[0]) + '</div><div class="value">' + escapeHTML(c[1]) + '</div></div>'
        ).join("") + '</div></div>'
      : "";

    const socialHTML = ["youtube","vimeo","instagram"].map(k => {
      const href = (project.social && project.social[k]) || "#";
      return '<a href="' + escapeHTML(href) + '" target="_blank" rel="noopener">' + SOCIAL_ICONS[k] + '</a>';
    }).join("");

    const textColor = project.textColor || "#fff3ef";
    const letterSpacing = (project.titleLetterSpacing!=null ? project.titleLetterSpacing : -0.02) + "em";
    const lineHeight = project.titleLineHeight!=null ? project.titleLineHeight : 1.02;
    const fontFamily = (project.titleFont && project.titleFont.dataUrl) ? "font-family:'ProjectTitleFont';" : "";
    const wScale = project.boxWidthScale!=null ? project.boxWidthScale : 1;
    const hScale = project.boxHeightScale!=null ? project.boxHeightScale : 1;
    const boxVars = "--box-max-w:" + Math.round(680*wScale) + "px;--box-min-w:" + Math.round(240*wScale) + "px;"
      + "--box-h-min:" + Math.round(300*hScale) + "px;--box-h-max:" + Math.round(620*hScale) + "px;--box-h-vh:" + (46*hScale) + "vh;";

    return '<div class="p-main">'
      +   '<div class="p-hero">' + heroMedia + '</div>'
      +   '<div class="p-colorbox" style="background:' + project.color + ';color:' + textColor + ';' + boxVars + '">'
      +     '<h1 style="letter-spacing:' + letterSpacing + ';line-height:' + lineHeight + ';' + fontFamily + '">' + escapeHTML(project.title||"Untitled") + '</h1></div>'
      +   '<div class="p-social" style="background:' + project.color + ';color:' + textColor + '">' + socialHTML + '</div>'
      + '</div>'
      + '<div class="p-detail">' + blocksHTML + creditsHTML + '</div>';

  /* ---- PC / Mobile toggle ----
     The frame's box is sized in JS (not CSS aspect-ratio) so it reliably fits — as large as
     possible — inside whatever space the 3-column layout leaves, without ever going taller
     than it is wide for the PC view. */
  const previewStage = document.getElementById("preview-stage");
  const previewFrameWrap = document.querySelector(".preview-frame-wrap");
  let currentView = "pc";

  function sizePreviewStage(){
    const padding = 28 * 2;
    const availW = previewStage.clientWidth - padding;
    const availH = previewStage.clientHeight - padding;
    if(currentView === "mobile"){
      previewFrameWrap.style.width = "390px";
      previewFrameWrap.style.height = "844px";
      return;
    }
    const ratio = 16/9;
    let w = availW, h = w / ratio;
    if(h > availH){ h = availH; w = h * ratio; }
    previewFrameWrap.style.width = Math.max(w, 0) + "px";
    previewFrameWrap.style.height = Math.max(h, 0) + "px";
  }

  document.querySelectorAll(".preview-toolbar .view-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".preview-toolbar .view-toggle button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      previewStage.classList.toggle("mobile", currentView === "mobile");
      previewStage.classList.toggle("pc", currentView === "pc");
      sizePreviewStage();
    });
  });
  window.addEventListener("resize", sizePreviewStage);
  sizePreviewStage();

  function exportProjectCode(project){
    const imgs = allImages(project);
    const hero = imgs.find(im => im.id === project.heroImageId) || imgs[0];
    const heroPath = hero ? (hero.relPath || hero.name) : "";
    const L = [];
    L.push("{");
    L.push("  id:" + JSON.stringify(project.id) + ",");
    L.push("  title:" + JSON.stringify(project.title) + ",");
    L.push("  category:" + JSON.stringify(projectCategory(project)) + ",");

      L.push("  titleFontDataUrl:" + JSON.stringify(project.titleFont.dataUrl) + ", /* base64 폰트 — 파일이 커서 코드가 길어질 수 있어요 */");

    L.push("  meta:" + JSON.stringify(project.meta||"") + ",");
    L.push("  hero:" + JSON.stringify(heroPath) + ",");
    L.push("  heroType:" + JSON.stringify(project.heroType||"image") + ",");
    if(project.heroType === "video") L.push("  heroVideoId:" + JSON.stringify(project.heroVideoId||"") + ",");
    L.push("  social:{ youtube:" + JSON.stringify(project.social.youtube||"#") + ", vimeo:" + JSON.stringify(project.social.vimeo||"#") + ", instagram:" + JSON.stringify(project.social.instagram||"#") + " },");
    L.push("  tag:" + JSON.stringify(project.tag||"") + ",");
    L.push("  year:" + JSON.stringify(project.year||"") + ",");
    L.push("  blocks:[");
    project.blocks.forEach((b, i) => {
      L.push("    {");
      L.push("      label:" + JSON.stringify(b.label||"") + ",");
      if(b.heading) L.push("      heading:" + JSON.stringify(b.heading) + ",");
      L.push("      images:[");
      b.images.forEach(im => L.push("        " + JSON.stringify(im.relPath || im.name) + ","));
      L.push("      ],");
      L.push("      paragraphs:[" + (b.paragraphs||[]).filter(Boolean).map(p => JSON.stringify(p)).join(", ") + "]");
      L.push("    }" + (i < project.blocks.length-1 ? "," : ""));
    });
    L.push("  ],");
    if(project.credits && project.credits.length){
      L.push("  credits:[");
      project.credits.forEach(c => L.push("    [" + JSON.stringify(c[0]) + ", " + JSON.stringify(c[1]) + "],"));
      L.push("  ]");
    } else {
      L.push("  credits:null");
    }
    L.push("}");
    return L.join("\n");
  }

  const exportModal = document.getElementById("export-modal");
  const exportText = document.getElementById("export-text");
  document.getElementById("export-btn").addEventListener("click", () => {
    const project = getCurrentProject();
    if(!project){ alert("먼저 프로젝트를 선택하세요."); return; }
    exportText.value = exportProjectCode(project);
    exportModal.classList.add("open");
  });
  document.getElementById("export-close").addEventListener("click", () => exportModal.classList.remove("open"));
  document.getElementById("export-copy").addEventListener("click", () => {
    exportText.select();
    navigator.clipboard.writeText(exportText.value).then(() => {
      const btn = document.getElementById("export-copy");
      const orig = btn.textContent;
      btn.textContent = "복사됨 ✓";
      setTimeout(() => { btn.textContent = orig; }, 1400);
    }).catch(() => document.execCommand("copy"));
  });

  /* ======================================================================
     9. theme toggle — bottom-left circle. Its own color previews the theme
     it will switch TO; clicking cycles mono → blue → dark → mono.
  ====================================================================== */
  const THEMES = [
    { id: "mono", key: "#ffffff" },
    { id: "blue", key: "#AEC3F7" },
    { id: "dark", key: "#000000" }
  ];
  let themeIndex = 0;
  const themeToggleBtn = document.getElementById("theme-toggle");

  function applyTheme(){
    const theme = THEMES[themeIndex];
    if(theme.id === "mono") delete document.body.dataset.theme;
    else document.body.dataset.theme = theme.id;
    const next = THEMES[(themeIndex + 1) % THEMES.length];
    themeToggleBtn.style.background = next.key;
    localStorage.setItem("pf-builder-theme", theme.id);
  }
  themeToggleBtn.addEventListener("click", () => {
    themeIndex = (themeIndex + 1) % THEMES.length;
    applyTheme();
  });
  (function initTheme(){
    const saved = localStorage.getItem("pf-builder-theme");
    const idx = THEMES.findIndex(t => t.id === saved);
    themeIndex = idx > -1 ? idx : 0;
    applyTheme();
  })();

  /* ======================================================================
     10. boot
  ====================================================================== */
  async function boot(){
    try{
      projects = await dbGetAll();
    }catch(e){
      console.error("DB load failed", e);
      projects = [];
    }
    projects.forEach(hydrateProject);
    if(!projects.length){
      const sample = buildSSFSampleProject();
      projects.push(sample);
      try{ await dbPut(sample); }catch(e){ console.error("sample save failed", e); }
    }
    /* migrate: projects saved before drag-reordering existed have no `order` —
       give them one (grouped by category, in whatever order dbGetAll() returned)
       so they sort consistently instead of jumping around once a peer gets reordered. */
    ["work","play"].forEach(cat => {
      let i = 0;
      projects.filter(p => projectCategory(p) === cat).forEach(p => {
        if(p.order == null){ p.order = i; dbPut(p).catch(e => console.error("order migration failed", e)); }
        i = Math.max(i, (p.order||0) + 1);
      });
    });
    const firstInTab = projects.find(p => projectCategory(p) === activeCategory);
    if(firstInTab) currentId = firstInTab.id;
    else if(projects.length) currentId = projects[0].id;
    renderSidebar();
    renderEditor();
    refreshPreview();
  }
  boot();

})();
</script>
