<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaehoon Choi — Art Director</title>
<style>
  :root{
    --bg:#f3f2ee;
    --fg:#111111;
    --muted:#78756c;
    --line: rgba(17,17,17,.14);
    --line-strong: rgba(17,17,17,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  body.project-open{overflow:hidden;}
  a{color:inherit; text-decoration:none;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  img{display:block; max-width:100%;}

  /* ---------- header ---------- */
  #site-header{
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px;
    font-size:13px; letter-spacing:.02em;
    mix-blend-mode:difference;
    color:#fff;
    pointer-events:none;
  }
  #site-header *{pointer-events:auto;}
  #site-header .brand{font-weight:600; cursor:pointer;}
  #site-header nav{display:flex; gap:22px;}
  #site-header nav button{opacity:.85;}
  #site-header nav button:hover{opacity:1;}
  #project-close{display:none; align-items:center; gap:6px;}
  #project-close.show{display:flex;}
  body.project-open #site-header nav{display:none;}

  /* ---------- intro: language marquee ---------- */
  #intro{
    height:100svh;
    display:flex; flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .lang-row{
    flex:1 1 0;
    display:flex; align-items:center;
    overflow:hidden;
    white-space:nowrap;
  }
  .lang-track{
    display:inline-flex;
    white-space:nowrap;
    animation:marquee linear infinite;
    will-change:transform;
  }
  .lang-row.reverse .lang-track{animation-direction:reverse;}
  .lang-track span{
    font-size:clamp(2.2rem, 7vw, 5.6rem);
    font-weight:800;
    letter-spacing:-.01em;
    padding-right:.6em;
  }
  @keyframes marquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .scroll-cue{
    position:absolute; left:50%; bottom:22px; z-index:5;
    transform:translateX(-50%);
    font-size:12px; color:#fff;
    background:rgba(0,0,0,.4);
    padding:6px 14px;
    border-radius:30px;
    display:flex; align-items:center; gap:8px;
  }
  .scroll-cue .dot{
    width:6px; height:6px; border-radius:50%;
    background:#fff;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}

  /* ---------- info (name / bio, follows the marquee) ---------- */
  #info{
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 6vw;
  }
  #info .eyebrow{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px;
  }
  #info h1{
    font-size:clamp(2.6rem, 9vw, 6.4rem);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.02;
  }
  #info h1 span{
    display:block;
    color:var(--muted);
    font-weight:500;
    font-size:.4em;
    margin-top:.5em;
    letter-spacing:0;
  }
  #info .bio{
    max-width:640px;
    margin-top:40px;
    font-size:clamp(1rem, 1.6vw, 1.2rem);
    color:#2b2a26;
    white-space:pre-line;
  }
  #info .intro-links{
    margin-top:36px;
    display:flex; gap:24px;
    font-size:14px;
  }
  #info .intro-links a{
    border-bottom:1px solid var(--line-strong);
    padding-bottom:2px;
  }
  #info .intro-links a:hover{border-color:var(--fg);}

  /* ---------- work ---------- */
  #work{padding:60px 6vw 120px;}
  #work h2{
    font-size:13px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  #work-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:56px 40px;
  }
  .work-card{cursor:pointer;}
  .work-card .thumb{
    position:relative;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#111;
  }
  .work-card .thumb img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .work-card:hover .thumb img{transform:scale(1.045);}
  .work-card .accent{
    position:absolute; left:0; bottom:0; right:0; height:4px;
  }
  .work-card .meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .work-card .meta .name{font-size:1.05rem; font-weight:700; letter-spacing:-.01em;}
  .work-card .meta .tag{font-size:12px; color:var(--muted);}

  @media (max-width:760px){
    #work-grid{grid-template-columns:1fr; gap:44px;}
  }

  /* ---------- project view ---------- */
  #project-view{
    display:none;
    position:fixed; inset:0; z-index:400;
    background:#fff;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #project-view.open{display:block;}

  .p-main{
    height:100svh;
    position:relative;
    overflow:hidden;
    background:#0d0d0d;
    --pmargin:2.2vmin;
    --pradius:clamp(14px, 1.6vw, 22px);
  }
  .p-hero{
    position:absolute; inset:0; z-index:1;
    overflow:hidden;
  }
  .p-hero img{
    width:100%; height:100%;
    object-fit:cover;
    position:absolute; inset:0;
  }
  .p-hero-video{position:absolute; inset:0;}
  .p-hero-video iframe{
    position:absolute; top:50%; left:50%;
    width:100vw; height:56.25vw;
    min-width:177.78vh; min-height:100vh;
    transform:translate(-50%,-50%);
    border:0; pointer-events:none;
  }
  .p-colorbox{
    position:absolute; top:var(--pmargin); left:var(--pmargin); z-index:2;
    width:fit-content;
    max-width:min(80vw, var(--box-max-w, 680px));
    min-width:var(--box-min-w, 240px);
    height:clamp(var(--box-h-min, 300px), var(--box-h-vh, 46vh), var(--box-h-max, 620px));
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:56px 48px;
    border-radius:var(--pradius);
    color:#fff3ef;
  }
  .p-colorbox h1{
    font-size:clamp(2.2rem, 4.4vw, 4.6rem);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.02;
    word-break:keep-all;
  }
  .p-social{
    position:absolute; right:var(--pmargin); bottom:var(--pmargin); z-index:20;
    display:flex; flex-direction:column; gap:12px;
    padding:14px;
    border-radius:var(--pradius);
    color:#fff3ef;
  }
  .p-social a{
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .2s;
  }
  .p-social a:hover{opacity:.6; transform:scale(1.08);}

  @media (max-width:760px){
    .p-colorbox{width:min(62%, 280px); max-width:min(62%, 280px); height:auto; min-height:0; padding:36px 22px 22px;}
    .p-colorbox h1{font-size:clamp(1.6rem, 8vw, 2.6rem);}
  }

  .p-detail{padding:80px 6vw 40px;}
  .p-block{max-width:920px; margin:0 auto 96px;}
  .gallery{
    position:relative;
    overflow:hidden;
    height:60vh;
    max-height:640px;
    min-height:280px;
    margin:0 auto;
    background:#111;
    cursor:pointer;
    transition:width .65s cubic-bezier(.65,0,.35,1), height .65s cubic-bezier(.65,0,.35,1);
  }
  .gallery-track{
    display:flex; flex-direction:row; height:100%;
    transition:transform .65s cubic-bezier(.65,0,.35,1);
  }
  .gallery-frame{flex:0 0 auto; height:100%;}
  .gallery-frame img{height:100%; width:auto; max-width:none; display:block;}
  .gallery-counter{
    position:absolute; right:14px; bottom:14px;
    font-size:11px; color:#fff;
    background:rgba(0,0,0,.45);
    padding:4px 8px;
    letter-spacing:.04em;
    pointer-events:none;
  }
  .gallery-hint{
    position:absolute; left:14px; bottom:14px;
    font-size:11px; color:#fff;
    background:rgba(0,0,0,.45);
    padding:4px 8px;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  .gallery:hover .gallery-hint{opacity:1;}

  .p-caption{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:24px;
    margin-top:22px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .p-caption .idx{font-size:12px; color:var(--muted); white-space:nowrap;}
  .p-caption .label{font-size:1rem; font-weight:700;}
  .p-body{
    margin-top:18px;
    font-size:.98rem;
    color:#2b2a26;
    white-space:pre-line;
  }
  .p-body.muted{color:var(--muted); font-style:italic;}

  .p-credits{max-width:1080px; margin:0 auto 100px; padding-top:8px;}
  .p-credits h3{
    font-size:13px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
    padding-bottom:18px; margin-bottom:30px;
    border-bottom:1px solid var(--line);
  }
  .credits-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:26px 24px;
  }
  .credit-item{border-top:1px solid var(--line); padding-top:10px;}
  .credit-item .label{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:6px;
  }
  .credit-item .value{font-size:.92rem; line-height:1.55; white-space:pre-line;}

  .p-nav{
    max-width:920px; margin:0 auto; padding:40px 6vw 90px;
    display:flex; justify-content:space-between;
    font-size:13px;
    border-top:1px solid var(--line);
  }
  .p-nav a{color:var(--muted);}
  .p-nav a:hover{color:var(--fg);}

  footer{
    padding:26px 6vw;
    font-size:12px; color:var(--muted);
    display:flex; justify-content:space-between;
    border-top:1px solid var(--line);
  }
</style>
</head>

    <nav>

  </section>

  <section id="work">

  <footer>

    <span>Art Director</span>
  </footer>

  <div id="project-view">
    <div id="project-scroll"></div>
  </div>

  /* ---------------- render: work grid ---------------- */
  const grid = document.getElementById("work-grid");
  PROJECTS.forEach(p => {
    const card = document.createElement("div");
    card.className = "work-card";
    card.innerHTML = `
      <div class="thumb">
        <img src="${u(p.hero)}" loading="lazy" alt="${p.title}">
        <div class="accent" style="background:${p.color}"></div>
      </div>
      <div class="meta">
        <span class="name">${p.title}</span>
        <span class="tag">${[p.tag, p.year].filter(Boolean).join(" · ")}</span>
      </div>`;
    card.addEventListener("click", () => openProject(p.id));
    grid.appendChild(card);
  });

  /* ---------------- render: project view ---------------- */
  const viewRoot = document.getElementById("project-view");
  const scrollRoot = document.getElementById("project-scroll");
  const closeBtn = document.getElementById("project-close");

  function galleryHTML(images, blockId){
    const frames = images.map(src => `<div class="gallery-frame"><img src="${u(src)}" alt=""></div>`).join("");
    return `
      <div class="gallery" data-block="${blockId}" data-index="0" data-count="${images.length}">
        <div class="gallery-track">${frames}</div>
        <div class="gallery-counter">01 / ${String(images.length).padStart(2,"0")}</div>
        <div class="gallery-hint">Click for next</div>
      </div>`;
  }

  function creditsHTML(project){
    if(!project.credits) return "";
    const items = project.credits.map(([label, value]) => `
      <div class="credit-item">
        <div class="label">${label}</div>
        <div class="value">${value}</div>
      </div>`).join("");
    return `
      <div class="p-credits">
        <h3>Credits</h3>
        <div class="credits-grid">${items}</div>
      </div>`;
  }

  function renderProject(project){
    const idx = PROJECTS.findIndex(p => p.id === project.id);
    const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
    const next = PROJECTS[(idx + 1) % PROJECTS.length];

    let fontStyleTag = document.getElementById("project-title-font");
    if(project.titleFontDataUrl){
      if(!fontStyleTag){
        fontStyleTag = document.createElement("style");
        fontStyleTag.id = "project-title-font";
        document.head.appendChild(fontStyleTag);
      }
      fontStyleTag.textContent = `@font-face{font-family:'ProjectTitleFont'; src:url(${project.titleFontDataUrl});}`;
    }else if(fontStyleTag){
      fontStyleTag.textContent = "";
    }

    const blocksHTML = project.blocks.map((block, bi) => {
      const blockId = `${project.id}-${bi}`;
      const heading = block.heading ? `<div class="p-body" style="font-weight:700; font-size:1.1rem; margin-top:22px;">${block.heading}</div>` : "";
      const paras = block.paragraphs.map(t => `<p class="p-body${t.startsWith("[")?" muted":""}">${t}</p>`).join("");
      return `
        <div class="p-block">
          ${galleryHTML(block.images, blockId)}
          <div class="p-caption">
            <span class="label">${block.label}</span>
            <span class="idx">${String(bi+1).padStart(2,"0")}</span>
          </div>
          ${heading}
          ${paras}
        </div>`;
    }).join("");

    const heroMedia = project.heroType === "video"
      ? `<div class="p-hero-video"><iframe src="https://player.vimeo.com/video/${project.heroVideoId}?autoplay=1&loop=1&muted=1&background=1&app_id=122963" title="${project.title}" allow="autoplay; fullscreen; picture-in-picture"></iframe></div>`
      : `<img src="${u(project.hero)}" alt="${project.title}">`;

    scrollRoot.innerHTML = `
      <div class="p-main">
        <div class="p-hero">
          ${heroMedia}
        </div>
        <div class="p-colorbox" style="background:${project.color}; color:${project.textColor || "#fff3ef"}; --box-max-w:${Math.round(680*(project.boxWidthScale!=null?project.boxWidthScale:1))}px; --box-min-w:${Math.round(240*(project.boxWidthScale!=null?project.boxWidthScale:1))}px; --box-h-min:${Math.round(300*(project.boxHeightScale!=null?project.boxHeightScale:1))}px; --box-h-max:${Math.round(620*(project.boxHeightScale!=null?project.boxHeightScale:1))}px; --box-h-vh:${46*(project.boxHeightScale!=null?project.boxHeightScale:1)}vh;">
          <h1 style="letter-spacing:${project.titleLetterSpacing!=null ? project.titleLetterSpacing : -0.02}em; line-height:${project.titleLineHeight!=null ? project.titleLineHeight : 1.02}; ${project.titleFontDataUrl ? "font-family:'ProjectTitleFont';" : ""}">${project.title}</h1>
        </div>
        <div class="p-social" style="background:${project.color}; color:${project.textColor || "#fff3ef"}">
          <a href="${project.social.youtube}" target="_blank" rel="noopener" title="YouTube">${socialIcon("youtube")}</a>
          <a href="${project.social.vimeo}" target="_blank" rel="noopener" title="Vimeo">${socialIcon("vimeo")}</a>
          <a href="${project.social.instagram}" target="_blank" rel="noopener" title="Instagram">${socialIcon("instagram")}</a>
        </div>
      </div>
      <div class="p-detail">
        ${blocksHTML}
        ${creditsHTML(project)}
      </div>
      <div class="p-nav">
        ${PROJECTS.length > 1 ? `<a href="#" data-prev>← ${prev.title}</a>` : `<span></span>`}
        <a href="#" data-allwork>All Work</a>
        ${PROJECTS.length > 1 ? `<a href="#" data-next>${next.title} →</a>` : `<span></span>`}
      </div>`;

    scrollRoot.querySelectorAll(".gallery").forEach(g => {
      g.addEventListener("click", () => rollGallery(g));
      activateGalleryFrame(g, 0);
    });
    if(PROJECTS.length > 1){
      scrollRoot.querySelector("[data-prev]").addEventListener("click", (e) => { e.preventDefault(); openProject(prev.id); });
      scrollRoot.querySelector("[data-next]").addEventListener("click", (e) => { e.preventDefault(); openProject(next.id); });
    }
    scrollRoot.querySelector("[data-allwork]").addEventListener("click", (e) => { e.preventDefault(); closeProject(); document.getElementById("work").scrollIntoView(); });
  }

  /* gallery height is a fixed base value (captured once from CSS, cached on the element)
     so it never compounds. width is derived per-image from that base height × its own
     natural ratio — and only shrinks the height when a very wide image would otherwise
     overflow the column, so nothing ever gets cropped. */
  function activateGalleryFrame(gallery, index){
    const frames = gallery.querySelectorAll(".gallery-frame");
    const frame = frames[index];
    const img = frame && frame.querySelector("img");
    if(!img) return;
    const apply = () => {
      if(!gallery.dataset.baseHeight){
        gallery.dataset.baseHeight = gallery.clientHeight;
      }
      const baseHeight = parseFloat(gallery.dataset.baseHeight);
      const ratio = img.naturalWidth / img.naturalHeight;
      const availWidth = gallery.parentElement.clientWidth;
      let height = baseHeight;
      let width = height * ratio;
      if(width > availWidth){
        width = availWidth;
        height = width / ratio;
      }
      gallery.style.height = height + "px";
      gallery.style.width = width + "px";
      gallery.querySelector(".gallery-track").style.transform = `translateX(-${frame.offsetLeft}px)`;
    };
    if(img.complete && img.naturalWidth){ apply(); }
    else{ img.addEventListener("load", apply, {once:true}); }
  }

  function rollGallery(gallery){
    const count = parseInt(gallery.dataset.count, 10);
    let index = parseInt(gallery.dataset.index, 10);
    index = (index + 1) % count;
    gallery.dataset.index = index;
    gallery.querySelector(".gallery-counter").textContent = `${String(index+1).padStart(2,"0")} / ${String(count).padStart(2,"0")}`;
    activateGalleryFrame(gallery, index);
  }

  window.addEventListener("resize", () => {
    scrollRoot.querySelectorAll(".gallery").forEach(g => {
      delete g.dataset.baseHeight;
      g.style.height = "";
      activateGalleryFrame(g, parseInt(g.dataset.index, 10));
    });
  });

  function openProject(id){
    const project = PROJECTS.find(p => p.id === id);
    if(!project) return;
    renderProject(project);
    viewRoot.classList.add("open");
    viewRoot.scrollTop = 0;
    document.body.classList.add("project-open");
    closeBtn.classList.add("show");
  }

  function closeProject(){
    viewRoot.classList.remove("open");
    document.body.classList.remove("project-open");
    closeBtn.classList.remove("show");
  }

  closeBtn.addEventListener("click", closeProject);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeProject(); });

  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => {
      closeProject();
      const target = el.dataset.go === "work" ? document.getElementById("work")
        : el.dataset.go === "info" ? document.getElementById("info")
        : document.getElementById("intro");
      target.scrollIntoView({behavior:"smooth"});
    });
  });

  if(location.hash){
    const deepLinkId = location.hash.slice(1);
    if(PROJECTS.some(p => p.id === deepLinkId)) openProject(deepLinkId);
  }

})();
